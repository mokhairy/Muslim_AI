[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [
    ".venv",
    "__pycache__",
    "migrations",
]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"Muslim_AI/settings_development.py" = ["I001", "F403", "F405"]
"Muslim_AI/settings_production.py" = ["I001", "F403", "F405"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
