[build]
buildCommand = "python -m pip install -r requirements.txt && DJANGO_SETTINGS_MODULE=Muslim_AI.settings_production DJANGO_SECRET_KEY=railway-build-only-secret-key DJANGO_ALLOWED_HOSTS=muslimai.up.railway.app python manage.py collectstatic --noinput"

[deploy]
startCommand = "DJANGO_SETTINGS_MODULE=Muslim_AI.settings_production python manage.py migrate --noinput && DJANGO_SETTINGS_MODULE=Muslim_AI.settings_production python -m gunicorn Muslim_AI.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
