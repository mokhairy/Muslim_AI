[build]
buildCommand = "python -m pip install -r requirements.txt && DJANGO_SETTINGS_MODULE=Muslim_AI.settings python manage.py collectstatic --noinput"

[deploy]
startCommand = "DJANGO_SETTINGS_MODULE=Muslim_AI.settings_production python -m gunicorn Muslim_AI.wsgi:application --bind 0.0.0.0:${PORT:-8000}"
